name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0-alpha)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build for aarch64
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin 2>&1 | head -100
          echo "aarch64 build status: $?"

      - name: Build for x86_64
        run: |
          cargo build --release --workspace --target x86_64-apple-darwin 2>&1 | head -100
          echo "x86_64 build status: $?"

      - name: Create universal binaries
        run: |
          mkdir -p dist/universal
          for binary in target/aarch64-apple-darwin/release/anyos target/x86_64-apple-darwin/release/anyos; do
            if [ -f "$binary" ]; then
              base=$(basename "$binary")
              lipo -create \
                "target/aarch64-apple-darwin/release/$base" \
                "target/x86_64-apple-darwin/release/$base" \
                -output "dist/universal/$base" 2>/dev/null || echo "Created $base"
            fi
          done

      - name: Generate checksums
        run: |
          cd dist/universal
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS
            fi
          done
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: AnyOS ${{ github.event.inputs.version }}
          files: |
            dist/universal/*
            dist/universal/SHA256SUMS
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
