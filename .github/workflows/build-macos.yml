name: Build AnyOS for macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          echo "HOST: $(uname -m)"

      - name: Build workspace for aarch64-apple-darwin
        run: cargo build --release --locked --workspace --target aarch64-apple-darwin

      - name: Build workspace for x86_64-apple-darwin
        run: cargo build --release --locked --workspace --target x86_64-apple-darwin

      - name: Create universal2 binaries
        run: |
          mkdir -p target/universal2-apple-darwin/release
          for b in anyos anyos-gui; do
            if [[ -f "target/aarch64-apple-darwin/release/$b" ]] && [[ -f "target/x86_64-apple-darwin/release/$b" ]]; then
              lipo -create \
                target/aarch64-apple-darwin/release/$b \
                target/x86_64-apple-darwin/release/$b \
                -output target/universal2-apple-darwin/release/$b
              lipo -info target/universal2-apple-darwin/release/$b
            fi
          done

      - name: Assemble AnyOS.app bundle
        run: |
          version="dev-${GITHUB_SHA::7}"
          app="dist/AnyOS.app/Contents"
          mkdir -p "$app/MacOS"
          if [[ -f "target/universal2-apple-darwin/release/anyos-gui" ]]; then
            cp target/universal2-apple-darwin/release/anyos-gui "$app/MacOS/"
          fi
          if [[ -f "target/universal2-apple-darwin/release/anyos" ]]; then
            cp target/universal2-apple-darwin/release/anyos "$app/MacOS/"
          fi
          if [[ -f "apps/anyos-gui/macos/Info.plist" ]]; then
            sed "s/@VERSION@/${version}/" apps/anyos-gui/macos/Info.plist > "$app/Info.plist"
          fi
          ls -lR dist/AnyOS.app

      - name: Verify app bundle
        run: |
          if [[ ! -f "dist/AnyOS.app/Contents/MacOS/anyos-gui" ]]; then
            echo "::warning::anyos-gui not found in AnyOS.app"
          else
            echo "AnyOS.app contains anyos-gui"
            file dist/AnyOS.app/Contents/MacOS/anyos-gui
          fi
          if [[ ! -f "dist/AnyOS.app/Contents/MacOS/anyos" ]]; then
            echo "::warning::anyos binary not found in AnyOS.app"
          else
            echo "AnyOS.app contains anyos CLI binary"
            file dist/AnyOS.app/Contents/MacOS/anyos
          fi

      - name: Upload AnyOS.app
        uses: actions/upload-artifact@v4
        with:
          name: AnyOS-macos-universal
          path: dist/AnyOS.app
          if-no-files-found: warn
