name: Build AnyOS for macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          echo "HOST: $(uname -m)"

      - name: Build anyos-cli and anyos-gui (aarch64)
        run: cargo build --release --locked -p anyos-cli -p anyos-gui --target aarch64-apple-darwin

      - name: Build anyos-cli and anyos-gui (x86_64)
        run: cargo build --release --locked -p anyos-cli -p anyos-gui --target x86_64-apple-darwin

      - name: Create universal2 binaries
        run: |
          mkdir -p target/universal2-apple-darwin/release
          for b in anyos anyos-gui; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output target/universal2-apple-darwin/release/$b
            lipo -info target/universal2-apple-darwin/release/$b
          done

      - name: Assemble AnyOS.app bundle
        run: |
          version="dev-${GITHUB_SHA::7}"
          app="dist/AnyOS.app/Contents"
          mkdir -p "$app/MacOS"
          cp target/universal2-apple-darwin/release/anyos-gui \
             target/universal2-apple-darwin/release/anyos \
             "$app/MacOS/"
          sed "s/@VERSION@/${version}/" apps/anyos-gui/macos/Info.plist > "$app/Info.plist"
          ls -lR dist/AnyOS.app

      - name: Verify app bundle
        run: |
          [[ -f "dist/AnyOS.app/Contents/MacOS/anyos-gui" ]] || \
            { echo "::error::AnyOS.app was not assembled correctly"; exit 1; }
          [[ -f "dist/AnyOS.app/Contents/MacOS/anyos" ]] || \
            { echo "::error::anyos binary missing from AnyOS.app"; exit 1; }
          echo "AnyOS.app OK"
          file dist/AnyOS.app/Contents/MacOS/anyos-gui
          file dist/AnyOS.app/Contents/MacOS/anyos

      - name: Upload AnyOS.app
        uses: actions/upload-artifact@v4
        with:
          name: AnyOS-macos-universal
          path: dist/AnyOS.app
          if-no-files-found: error
