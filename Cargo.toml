[workspace]
resolver = "2"
members = [
    "crates/anyos-pe",
    "crates/anyos-memory",
    "crates/anyos-loader",
    "crates/anyos-net",
    "crates/anyos-format",
    "crates/anyos-elf",
    "crates/anyos-linux",
    "crates/anyos-exec",
    "apps/anyos-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
anyos-pe = { path = "crates/anyos-pe" }
anyos-memory = { path = "crates/anyos-memory" }
anyos-loader = { path = "crates/anyos-loader" }
anyos-net = { path = "crates/anyos-net" }
anyos-format = { path = "crates/anyos-format" }
anyos-elf = { path = "crates/anyos-elf" }
anyos-linux = { path = "crates/anyos-linux" }
anyos-exec = { path = "crates/anyos-exec" }
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64", "elf32", "elf64"] }
libc = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "1"

[profile.release]
lto = "thin"
